[package]
name = "wraith"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Sunder Wraith, the Shard"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
